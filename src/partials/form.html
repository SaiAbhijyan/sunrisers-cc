<div class="no-js-only ph"><p>The message form needs JavaScript. Contact details are not published yet.</p></div>
<div class="js-only">
<form class="form" id="contact-form" novalidate data-endpoint="" aria-describedby="form-note">
  <div class="form__row">
    <div class="field"><label for="f-first">First name</label><input id="f-first" name="first" type="text" autocomplete="given-name" required maxlength="60"><p class="field__error" id="f-first-err" role="alert"></p></div>
    <div class="field"><label for="f-last">Last name</label><input id="f-last" name="last" type="text" autocomplete="family-name" required maxlength="60"><p class="field__error" id="f-last-err" role="alert"></p></div>
  </div>
  <div class="form__row">
    <div class="field"><label for="f-email">Email address</label><input id="f-email" name="email" type="email" autocomplete="email" required maxlength="120" inputmode="email"><p class="field__error" id="f-email-err" role="alert"></p></div>
    <div class="field"><label for="f-phone">Phone <span class="hint">(optional)</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" inputmode="tel"><p class="field__error" id="f-phone-err" role="alert"></p></div>
  </div>
  <div class="field"><label for="f-topic">What is it about?</label>
    <select id="f-topic" name="topic" required>
      <option value="">Choose one</option>
      <option>Joining the team</option>
      <option>Fixtures</option>
      <option>Sponsorship</option>
      <option>Something else</option>
    </select><p class="field__error" id="f-topic-err" role="alert"></p></div>
  <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required minlength="10" maxlength="1500"></textarea><span class="hint">Tell us what level you play. Up to 1500 characters.</span><p class="field__error" id="f-msg-err" role="alert"></p></div>
  <div class="hp" aria-hidden="true"><label for="f-site">Leave this empty</label><input id="f-site" name="website" type="text" tabindex="-1" autocomplete="off"></div>
  <p class="small" id="form-note">Preview build: this form checks your answers but is not connected to an inbox yet, so nothing is sent.</p>
  <p class="form__status" id="form-status" role="status" aria-live="polite" hidden></p>
  <div><button class="btn btn--ink" type="submit">Send message</button></div>
</form>
</div>
